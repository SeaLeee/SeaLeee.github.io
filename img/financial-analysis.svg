<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)" rx="10"/>
  
  <!-- Main container -->
  <rect x="40" y="40" width="720" height="320" fill="white" rx="10" stroke="none" opacity="0.95"/>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" fill="#2c3e50" font-size="32" font-weight="bold" font-family="Arial">沪深300 vs M1-M2增速分析</text>
  
  <!-- Subtitle -->
  <text x="400" y="110" text-anchor="middle" fill="#7f8c8d" font-size="16" font-family="Arial">📊 投资策略 · 数据驱动 · 风险管控</text>
  
  <!-- Chart bars -->
  <rect x="120" y="200" width="40" height="80" fill="url(#barGradient)" rx="3"/>
  <rect x="180" y="210" width="40" height="70" fill="url(#barGradient)" rx="3"/>
  <rect x="240" y="190" width="40" height="90" fill="url(#barGradient)" rx="3"/>
  <rect x="300" y="180" width="40" height="100" fill="url(#barGradient)" rx="3"/>
  <rect x="360" y="220" width="40" height="60" fill="url(#barGradient)" rx="3"/>
  <rect x="420" y="185" width="40" height="95" fill="url(#barGradient)" rx="3"/>
  <rect x="480" y="175" width="40" height="105" fill="url(#barGradient)" rx="3"/>
  <rect x="540" y="195" width="40" height="85" fill="url(#barGradient)" rx="3"/>
  
  <!-- Chart labels -->
  <text x="140" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">10月</text>
  <text x="200" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">11月</text>
  <text x="260" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">12月</text>
  <text x="320" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">1月</text>
  <text x="380" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">2月</text>
  <text x="440" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">3月</text>
  <text x="500" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">4月</text>
  <text x="560" y="300" text-anchor="middle" fill="#2c3e50" font-size="10" font-family="Arial">5月</text>
  
  <!-- Stats boxes -->
  <g transform="translate(120, 320)">
    <text x="0" y="0" fill="#e74c3c" font-size="18" font-weight="bold" font-family="Arial">+1.25%</text>
    <text x="0" y="15" fill="#7f8c8d" font-size="10" font-family="Arial">今日涨跌幅</text>
  </g>
  
  <g transform="translate(240, 320)">
    <text x="0" y="0" fill="#e74c3c" font-size="18" font-weight="bold" font-family="Arial">-2.6%</text>
    <text x="0" y="15" fill="#7f8c8d" font-size="10" font-family="Arial">M1-M2差值</text>
  </g>
  
  <g transform="translate(360, 320)">
    <text x="0" y="0" fill="#e74c3c" font-size="18" font-weight="bold" font-family="Arial">3/5</text>
    <text x="0" y="15" fill="#7f8c8d" font-size="10" font-family="Arial">投资信号</text>
  </g>
  
  <g transform="translate(480, 320)">
    <text x="0" y="0" fill="#e74c3c" font-size="18" font-weight="bold" font-family="Arial">60%</text>
    <text x="0" y="15" fill="#7f8c8d" font-size="10" font-family="Arial">建议仓位</text>
  </g>
  
  <!-- Trend line -->
  <polyline points="140,240 200,245 260,235 320,230 380,250 440,232 500,225 560,238" 
            fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.8"/>
  
</svg>