# 数据更新配置文件
# 用于配置数据获取的API接口和更新策略

[data_sources]
# 沪深300指数数据源
hs300_source = "manual"  # 可选: manual, akshare, tushare, eastmoney
hs300_api_key = ""      # API密钥（如需要）

# M2货币供应量数据源  
m2_source = "manual"     # 可选: manual, pboc, fred, wind
m2_api_key = ""         # API密钥（如需要）

[update_schedule]
# 更新频率设置
auto_update = false      # 是否启用自动更新
update_time = "09:00"    # 每日更新时间
weekend_skip = true      # 是否跳过周末

[notification]
# 通知设置
email_notify = false     # 邮件通知
email_address = ""       # 通知邮箱
wechat_notify = false    # 微信通知

[backup]
# 数据备份设置
backup_enabled = true    # 启用数据备份
backup_days = 30         # 保留天数